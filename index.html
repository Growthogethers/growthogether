<!-- index.html - PERBAIKAN -->
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
  <title>Growthogether - Jalan Bareng, Mimpi Nyata</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <!-- Google Fonts Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <!-- Chart.js untuk grafik -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  
  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ec4899">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Growthogether">
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/icon.svg">
  <link rel="apple-touch-icon" href="assets/icon-192x192.png">
  
  <!-- CSS Custom -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="sidebar-container"></div>
  <div id="app-content"></div>
  <div id="bottom-nav-container"></div>
  <div id="modals-container"></div>
  <div id="login-screen"></div>
  
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/app.js"></script>
  
  <!-- Service Worker untuk PWA -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').then(reg => {
          console.log('Service Worker registered:', reg);
        }).catch(err => {
          console.log('Service Worker registration failed:', err);
        });
      });
    }
  </script>
  
  <style>
    /* PERBAIKAN: Pastikan body dan container tidak overflow */
    body {
      overflow-x: hidden;
      margin: 0;
      padding: 0;
    }
    
    /* PERBAIKAN: Login screen styling yang benar */
    #login-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #ec4899 0%, #fbbf24 50%, #f43f5e 100%);
      z-index: 10000 !important;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.4s ease, visibility 0.4s ease;
      visibility: visible;
      opacity: 1;
      overflow-y: auto;
    }
    
    #login-screen.hide,
    #login-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    
    /* PERBAIKAN: Pastikan app-content dan sidebar tersembunyi sebelum login */
    #app-sidebar,
    #app-content,
    .bottom-nav,
    .dark-mode-fab {
      display: none !important;
    }
    
    /* Saat logged in, tampilkan komponen aplikasi */
    body.logged-in #app-sidebar {
      display: flex !important;
    }
    
    body.logged-in #app-content {
      display: block !important;
    }
    
    body.logged-in .bottom-nav {
      display: flex !important;
    }
    
    body.logged-in .dark-mode-fab {
      display: flex !important;
    }
    
    body.logged-in #login-screen {
      display: none !important;
    }
  </style>
</body>
</html>
