<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
  <title>GrowthTogether - Jalan Bareng, Mimpi Nyata</title>
  
  <!-- Bootstrap 5 + Icons + Font -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
  
  <!-- CSS Utama -->
  <link rel="stylesheet" href="style/style.css">
  
  <style>
    /* Additional styles */
    .badge-pro {
      background: linear-gradient(135deg, #7009b4, #4000C6);
      color: white;
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 20px;
    }
    .badge-basic {
      background: #3b82f6;
      color: white;
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 20px;
    }
    .badge-free {
      background: #10b981;
      color: white;
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 20px;
    }
    
    /* Login screen fix */
    #login-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #7009b4 0%, #4000C6 100%);
      z-index: 9999;
      display: flex !important;
      align-items: center;
      justify-content: center;
    }
    
    body.logged-in #login-screen {
      display: none !important;
    }
    
    body.logged-in #app-sidebar,
    body.logged-in #app-content {
      display: block;
    }
    
    #app-sidebar, #app-content {
      display: none;
    }
    
    /* Loading screen */
    #initialLoader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #7009b4 0%, #4000C6 100%);
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }
  </style>
</head>
<body>

<!-- Loading Screen -->
<div id="initialLoader">
  <div class="text-center text-white">
    <i class="bi bi-arrow-through-heart-fill fs-1 mb-3" style="animation: pulse 2s ease-in-out infinite; display: inline-block;"></i>
    <h3 class="fw-bold">growthogether</h3>
    <p class="mb-3">jalan bareng, mimpi nyata</p>
    <div class="spinner-border text-white" role="status" style="width: 44px; height: 44px;">
      <span class="visually-hidden">Loading...</span>
    </div>
    <p class="mt-3 small opacity-75">Mempersiapkan aplikasi...</p>
  </div>
</div>

<!-- Tempat untuk Sidebar (akan diisi oleh JS) -->
<div id="sidebar-container"></div>

<!-- Tempat untuk Modals (akan diisi oleh JS) -->
<div id="modals-container"></div>

<!-- Main Content (akan diisi oleh JS) -->
<div id="app-content"></div>

<!-- Login Screen (akan diisi oleh JS) -->
<div id="login-screen"></div>

<!-- Dark Mode FAB -->
<button class="dark-mode-fab" id="darkModeFab" style="display: none;">
  <i class="bi bi-moon-stars fs-5"></i>
</button>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getDatabase } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
  
  // Firebase Config
  const firebaseConfig = { 
    apiKey: "AIzaSyBeUaOyesw9ucpBGumNjrzUp3WfUtXu39w", 
    authDomain: "growthogether.firebaseapp.com", 
    databaseURL: "https://growthogether-default-rtdb.asia-southeast1.firebasedatabase.app", 
    projectId: "growthogether", 
    storageBucket: "growthogether.firebasestorage.app", 
    messagingSenderId: "784796645743", 
    appId: "1:784796645743:web:e4eb40810d3051826d909a" 
  };
  
  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  
  window.db = db;
  
  // Hide initial loader setelah 1 detik
  setTimeout(() => {
    const loader = document.getElementById('initialLoader');
    if (loader) {
      loader.style.opacity = '0';
      setTimeout(() => loader.remove(), 500);
    }
  }, 1000);
  
  // Import app.js
  import('./js/app.js').catch(err => {
    console.error("Failed to load app.js:", err);
    document.getElementById('initialLoader').innerHTML = `
      <div class="text-center text-white">
        <i class="bi bi-exclamation-triangle-fill fs-1 mb-3"></i>
        <h3 class="fw-bold">Error</h3>
        <p class="mb-3">Gagal memuat aplikasi: ${err.message}</p>
      </div>
    `;
  });
</script>
</body>
</html>
