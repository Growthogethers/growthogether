<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Growthogether - Momen Spesial</title>

    <!-- Bootstrap 5 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <!-- CSS Custom -->
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- TEMPLATE CONTAINERS -->
    <div id="login-screen"></div>
    <div id="sidebar-container"></div>
    <div id="app-content"></div>
    <div id="bottom-nav-container"></div>
    <div id="modals-container"></div>

    <!-- Toast -->
    <div
      id="customToast"
      class="toast align-items-center border-0 text-bg-success"
    >
      <div class="d-flex">
        <div class="toast-body"></div>
        <button
          type="button"
          class="btn-close btn-close-white me-2 m-auto"
          onclick="window.hideToast()"
        ></button>
      </div>
    </div>

    <!-- Menu Toggle & Dark Mode FAB -->
    <button class="menu-toggle-hp" id="menuToggleHp">
      <i class="bi bi-list"></i>
    </button>
    <button id="darkModeFab" class="dark-mode-fab">
      <i class="bi bi-moon-stars fs-5"></i>
    </button>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Firebase Modules -->
    <script type="module" src="js/app.js"></script>
  </body>
</html>
