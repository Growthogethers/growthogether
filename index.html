<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
  <title>GrowthTogether - Jalan Bareng, Mimpi Nyata</title>
  
  <!-- Bootstrap 5 + Icons + Font -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
  
  <!-- CSS Utama -->
  <link rel="stylesheet" href="style/style.css">
  
  <style>
    /* Additional styles untuk level badge */
    .badge-pro {
      background: linear-gradient(135deg, #7009b4, #4000C6);
      color: white;
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 20px;
    }
    .badge-basic {
      background: #3b82f6;
      color: white;
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 20px;
    }
    .badge-free {
      background: #10b981;
      color: white;
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 20px;
    }
    
    /* Fix untuk login screen */
    #login-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    body.logged-in #login-screen {
      display: none !important;
    }
    
    body.logged-in #app-sidebar,
    body.logged-in #app-content,
    body.logged-in .dark-mode-fab,
    body.logged-in #customToastContainer,
    body.logged-in .hamburger-menu-btn {
      display: block;
    }
    
    #app-sidebar, #app-content, .dark-mode-fab, #customToastContainer, .hamburger-menu-btn {
      display: none;
    }
    
    .sidebar, #app-sidebar {
      display: flex;
    }
    
    body.logged-in .sidebar,
    body.logged-in #app-sidebar {
      display: flex;
    }
  </style>
</head>
<body>

<!-- Tempat untuk Sidebar (akan diisi oleh JS) -->
<div id="sidebar-container"></div>

<!-- Tempat untuk Modals (akan diisi oleh JS) -->
<div id="modals-container"></div>

<!-- Main Content (akan diisi oleh JS) -->
<div id="app-content"></div>

<!-- Login Screen (akan diisi oleh JS) -->
<div id="login-screen"></div>

<!-- Dark Mode FAB -->
<button class="dark-mode-fab" id="darkModeFab" style="display: none;">
  <i class="bi bi-moon-stars fs-5"></i>
</button>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getDatabase } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
  
  // Firebase Config
  const firebaseConfig = { 
    apiKey: "AIzaSyBeUaOyesw9ucpBGumNjrzUp3WfUtXu39w", 
    authDomain: "growthogether.firebaseapp.com", 
    databaseURL: "https://growthogether-default-rtdb.asia-southeast1.firebasedatabase.app", 
    projectId: "growthogether", 
    storageBucket: "growthogether.firebasestorage.app", 
    messagingSenderId: "784796645743", 
    appId: "1:784796645743:web:e4eb40810d3051826d909a" 
  };
  
  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  
  // Expose db ke window agar bisa diakses oleh module lain
  window.db = db;
  
  // Dynamic import app.js
  import('./js/app.js');
</script>

<!-- Service Worker untuk PWA (opsional) -->
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').then(reg => {
      console.log('Service Worker registered', reg);
    }).catch(err => {
      console.log('Service Worker registration failed', err);
    });
  }
</script>
</body>
</html>
