<!-- DASHBOARD PAGE - Kosong -->
<section id="dashboard-page">
  <div class="d-flex flex-wrap justify-content-between align-items-center mb-4">
    <h3 class="fw-bold m-0">
      👋 Halo, <span id="userGreet" class="text-primary"></span>
    </h3>
    <button
      id="privacyToggleDash"
      class="btn btn-outline-secondary btn-sm rounded-pill px-3"
    >
      <i class="bi bi-eye-slash me-1"></i> Privasi
    </button>
  </div>

  <div class="card p-5 text-center">
    <i class="bi bi-arrow-through-heart-fill fs-1 text-muted mb-3"></i>
    <h5 class="text-muted">Selamat Datang di Growthogether</h5>
    <p class="text-muted">Halaman dashboard akan segera hadir</p>
  </div>
</section>

<!-- MOMENT PAGE -->
<section id="moment-page" style="display: none">
  <div
    class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
    <h3 class="fw-bold">
      <i class="bi bi-calendar-heart-fill me-2 text-danger"></i>Momen Spesial
      Kita
    </h3>
  </div>

  <div class="card p-3 p-md-4 mb-4 border-0 shadow-sm">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <button
        class="btn btn-sm btn-outline-secondary rounded-circle"
        onclick="changeMonth(-1)">
        <i class="bi bi-chevron-left"></i>
      </button>
      <h4 class="fw-bold mb-0" id="currentMonthYear"></h4>
      <button
        class="btn btn-sm btn-outline-secondary rounded-circle"
        onclick="changeMonth(1)">
        <i class="bi bi-chevron-right"></i>
      </button>
    </div>
    <div class="calendar-grid" id="calendarGrid"></div>
  </div>

  <div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="fw-bold">
      <i class="bi bi-collection me-2 text-danger"></i>Koleksi Momen
    </h5>
    <span id="momentsCount" class="badge bg-secondary">0 momen</span>
  </div>

  <div id="momentsList" class="row g-3"></div>
</section>
