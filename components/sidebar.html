<div class="sidebar" id="app-sidebar">
  <!-- Header -->
  <div class="d-flex align-items-center justify-content-between mb-4 px-2">
    <div class="d-flex align-items-center gap-2">
      <i class="bi bi-heart-fill text-danger fs-4"></i>
      <h5 class="fw-bold m-0">growthogether</h5>
    </div>
    <button class="btn-close btn-close-white d-md-none" id="closeSidebarBtn" style="filter: invert(1);"></button>
  </div>

  <!-- PROFILE SECTION - Klik untuk buka modal -->
  <div class="profile-section text-center mb-4" id="profileTrigger" style="cursor: pointer;">
    <div class="position-relative d-inline-block">
      <div class="profile-avatar-wrapper" id="profileAvatarWrapper">
        <img id="profileAvatar" class="profile-avatar" src="https://ui-avatars.com/api/?background=6366f1&color=fff&bold=true&name=User" alt="Profile">
        <div class="profile-status" id="profileStatus">
          <i class="bi bi-check-circle-fill"></i>
        </div>
      </div>
      <div class="edit-profile-badge">
        <i class="bi bi-pencil-fill"></i>
      </div>
    </div>
    <h6 class="fw-bold mt-2 mb-0" id="profileName">User</h6>
    <small class="text-muted status-text" id="profileStatusText">sedang merencanakan</small>
  </div>

  <!-- Navigation Menu -->
  <nav class="nav flex-column">
    <a class="nav-link" data-page="dashboard">
      <i class="bi bi-speedometer2 me-3"></i>Dashboard
    </a>
    <a class="nav-link" data-page="moment">
      <i class="bi bi-calendar-heart me-3"></i>Moment
    </a>
  </nav>

  <!-- Bottom Section -->
  <div class="mt-auto pt-4">
    <div class="d-grid gap-2">
      <button class="btn btn-sm btn-outline-danger" onclick="confirmLogout()">
        <i class="bi bi-box-arrow-right me-2"></i>Keluar
      </button>
    </div>
  </div>
</div>
