<!-- components/sidebar.html - Dengan Tombol Hamburger untuk Mobile & Scrollable -->
<div class="sidebar" id="app-sidebar">
  <!-- Tombol Close untuk Mobile -->
  <div class="sidebar-close-btn" id="sidebarCloseBtn">
    <i class="bi bi-x-lg"></i>
  </div>
  
  <div class="sidebar-header text-center mb-4">
    <div class="d-flex flex-column align-items-center">
      <div class="logo-wrapper mb-2">
        <i class="bi bi-arrow-through-heart-fill text-danger fs-2"></i>
      </div>
      <h5 class="fw-bold m-0 app-title">growthogether</h5>
      <small class="text-muted tagline">jalan bareng, mimpi nyata</small>
    </div>
  </div>

  <!-- Profile Section untuk Desktop & Mobile -->
  <div class="profile-section text-center mb-4" id="profileTrigger" style="cursor: pointer;">
    <div class="position-relative d-inline-block">
      <div class="profile-avatar-wrapper">
        <img id="profileAvatar" class="profile-avatar" src="https://ui-avatars.com/api/?background=7009b4&color=fff&bold=true&name=User" alt="Profile">
        <div class="profile-status" id="profileStatus">
          <i class="bi bi-calendar-check-fill"></i>
        </div>
      </div>
      <div class="edit-profile-badge">
        <i class="bi bi-pencil-fill"></i>
      </div>
    </div>
    <h6 class="fw-bold mt-2 mb-0" id="profileName">User</h6>
    <small class="text-muted status-text" id="profileStatusText">sedang merencanakan</small>
  </div>

  <!-- NAVIGATION MENU - Scrollable area untuk mobile -->
  <div class="sidebar-nav-scroll">
    <nav class="nav flex-column">
      <a class="nav-link" data-page="dashboard">
        <i class="bi bi-speedometer2 me-3"></i>
        <span class="nav-text">Dashboard</span>
      </a>
      <a class="nav-link" data-page="moment">
        <i class="bi bi-calendar-heart me-3"></i>
        <span class="nav-text">Moment</span>
      </a>
      <a class="nav-link" data-page="keuangan">
        <i class="bi bi-wallet2 me-3"></i>
        <span class="nav-text">Keuangan</span>
      </a>
      <a class="nav-link" data-page="catatan">
        <i class="bi bi-journal-bookmark-fill me-3"></i>
        <span class="nav-text">Catatan</span>
      </a>
      <a class="nav-link" data-page="impian">
        <i class="bi bi-stars me-3"></i>
        <span class="nav-text">Impian</span>
      </a>
      <a class="nav-link" data-page="laporan">
        <i class="bi bi-file-text-fill me-3"></i>
        <span class="nav-text">Laporan</span>
      </a>
    </nav>
  </div>

  <div class="mt-auto pt-4">
    <div class="d-grid gap-2">
      <button class="btn btn-sm btn-outline-danger" id="sidebarLogoutBtn">
        <i class="bi bi-box-arrow-right me-2"></i>
        <span class="nav-text">Keluar</span>
      </button>
    </div>
  </div>
</div>

<!-- Tombol Hamburger untuk Mobile -->
<button class="hamburger-menu-btn" id="hamburgerMenuBtn">
  <i class="bi bi-list"></i>
</button>

<!-- Overlay untuk menutup sidebar saat klik di luar -->
<div class="sidebar-overlay" id="sidebarOverlay"></div>
