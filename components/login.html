<!DOCTYPE html>
<div class="login-container">
  <div class="login-card-modern text-center">
    <div class="brand-circle-modern mx-auto">
      <i class="bi bi-arrow-through-heart-fill"></i>
    </div>
    <h1 class="greeting-text-modern">growthogether</h1>
    <p class="sub-greeting-modern">jalan bareng, mimpi nyata ✨</p>
    
    <div class="input-icon">
      <i class="bi bi-person-circle"></i>
      <input type="text" id="loginUser" class="input-modern" placeholder="Username" autocomplete="off" spellcheck="false">
    </div>
    
    <div class="input-icon">
      <i class="bi bi-lock-fill"></i>
      <input type="password" id="loginPass" class="input-modern" placeholder="Kata sandi">
    </div>
    
    <button onclick="handleLogin()" class="login-btn-modern w-100 mt-3">
      <i class="bi bi-box-arrow-in-right me-2"></i> Masuk
    </button>
    
    <button onclick="resetToDefaultPassword()" class="reset-btn-modern w-100 mt-2">
      <i class="bi bi-arrow-repeat me-2"></i> Reset Password ke Default (12345)
    </button>
    
    <div id="loginErrorMsg" class="mt-3 text-danger" style="display:none">
      <i class="bi bi-exclamation-triangle-fill"></i> <span id="errorText"></span>
    </div>
    
    <div class="mt-4">
      <small class="text-muted">
        <i class="bi bi-heart-fill text-danger"></i> 
        Pasangan bahagia, masa depan cerah
      </small>
    </div>
  </div>
</div>

<!-- Floating hearts background -->
<div class="floating-heart-bg" style="top: 10%; left: 5%;">❤️</div>
<div class="floating-heart-bg" style="top: 20%; right: 8%;">💖</div>
<div class="floating-heart-bg" style="bottom: 15%; left: 10%;">💕</div>
<div class="floating-heart-bg" style="bottom: 25%; right: 15%;">💗</div>
<div class="floating-heart-bg" style="top: 50%; left: 20%;">💓</div>

<style>

/* Fix for input autofill */
.input-modern:-webkit-autofill,
.input-modern:-webkit-autofill:hover,
.input-modern:-webkit-autofill:focus,
.input-modern:-webkit-autofill:active {
  -webkit-box-shadow: 0 0 0 30px white inset !important;
  box-shadow: 0 0 0 30px white inset !important;
}

body.dark .input-modern:-webkit-autofill,
body.dark .input-modern:-webkit-autofill:hover,
body.dark .input-modern:-webkit-autofill:focus,
body.dark .input-modern:-webkit-autofill:active {
  -webkit-box-shadow: 0 0 0 30px #1e293b inset !important;
  box-shadow: 0 0 0 30px #1e293b inset !important;
}
</style>
