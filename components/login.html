<!DOCTYPE html>
<div class="login-container">
  <div class="login-card-modern text-center">
    <div class="brand-circle-modern mx-auto">
      <i class="bi bi-arrow-through-heart-fill"></i>
    </div>
    <h1 class="greeting-text-modern">growthogether</h1>
    <p class="sub-greeting-modern">jalan bareng, mimpi nyata ✨</p>
    
    <!-- Tab Navigation -->
    <div class="login-tabs mb-4">
      <button class="tab-btn active" data-tab="login" onclick="switchTab('login')">
        <i class="bi bi-box-arrow-in-right me-2"></i>Login
      </button>
      <button class="tab-btn" data-tab="register" onclick="switchTab('register')">
        <i class="bi bi-person-plus-fill me-2"></i>Register
      </button>
    </div>
    
    <!-- LOGIN FORM -->
    <div id="loginTab" class="tab-content active">
      <div class="input-icon">
        <i class="bi bi-person-badge"></i>
        <input type="text" id="loginIdentifier" class="input-modern" placeholder="Username / No HP / Email" autocomplete="off">
      </div>
      
      <div class="input-icon">
        <i class="bi bi-lock-fill"></i>
        <input type="password" id="loginPassword" class="input-modern" placeholder="Kata sandi">
      </div>
      
      <button onclick="handleLogin()" class="login-btn-modern w-100 mt-3">
        <i class="bi bi-box-arrow-in-right me-2"></i> Masuk
      </button>
    </div>
    
    <!-- REGISTER FORM -->
    <div id="registerTab" class="tab-content" style="display: none;">
      <div class="input-icon">
        <i class="bi bi-person-circle"></i>
        <input type="text" id="regFullname" class="input-modern" placeholder="Nama Lengkap" autocomplete="off">
      </div>
      
      <div class="input-icon">
        <i class="bi bi-person-badge"></i>
        <input type="text" id="regUsername" class="input-modern" placeholder="Username (unique)" autocomplete="off">
        <small class="text-muted" id="usernameStatus" style="font-size: 10px; display: block; text-align: left; margin-top: 4px;"></small>
      </div>
      
      <div class="input-icon">
        <i class="bi bi-telephone"></i>
        <input type="tel" id="regPhone" class="input-modern" placeholder="Nomor HP (contoh: 08123456789)" autocomplete="off">
        <small class="text-muted" id="phoneStatus" style="font-size: 10px; display: block; text-align: left; margin-top: 4px;"></small>
      </div>
      
      <div class="input-icon">
        <i class="bi bi-envelope"></i>
        <input type="email" id="regEmail" class="input-modern" placeholder="Email" autocomplete="off">
        <small class="text-muted" id="emailStatus" style="font-size: 10px; display: block; text-align: left; margin-top: 4px;"></small>
      </div>
      
      <div class="input-icon">
        <i class="bi bi-lock-fill"></i>
        <input type="password" id="regPassword" class="input-modern" placeholder="Password (minimal 4 karakter)">
      </div>
      
      <div class="input-icon">
        <i class="bi bi-lock-fill"></i>
        <input type="password" id="regConfirmPassword" class="input-modern" placeholder="Konfirmasi Password">
      </div>
      
      <button onclick="handleRegister()" class="login-btn-modern w-100 mt-3" id="registerBtn">
        <i class="bi bi-person-plus-fill me-2"></i> Daftar Akun Baru
      </button>
    </div>
    
    <div id="loginErrorMsg" class="mt-3 text-danger" style="display:none">
      <i class="bi bi-exclamation-triangle-fill"></i> <span id="errorText"></span>
    </div>
    
    <div id="loginSuccessMsg" class="mt-3 text-success" style="display:none">
      <i class="bi bi-check-circle-fill"></i> <span id="successText"></span>
    </div>
    
    <div class="mt-4">
      <small class="text-muted">
        <i class="bi bi-heart-fill text-danger"></i> 
        Pasangan bahagia, masa depan cerah
      </small>
    </div>
  </div>
</div>

<!-- Floating hearts background -->
<div class="floating-heart-bg" style="top: 10%; left: 5%;">❤️</div>
<div class="floating-heart-bg" style="top: 20%; right: 8%;">💖</div>
<div class="floating-heart-bg" style="bottom: 15%; left: 10%;">💕</div>
<div class="floating-heart-bg" style="bottom: 25%; right: 15%;">💗</div>
<div class="floating-heart-bg" style="top: 50%; left: 20%;">💓</div>

<style>
/* Tab styles */
.login-tabs {
  display: flex;
  gap: 10px;
  background: #f1f5f9;
  border-radius: 60px;
  padding: 4px;
}

.tab-btn {
  flex: 1;
  padding: 10px 16px;
  border: none;
  background: transparent;
  border-radius: 60px;
  font-weight: 600;
  font-size: 0.9rem;
  color: #64748b;
  cursor: pointer;
  transition: all 0.3s ease;
}

.tab-btn.active {
  background: linear-gradient(135deg, #6366f1, #8b5cf6);
  color: white;
  box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
}

.tab-btn:active {
  transform: scale(0.98);
}

.tab-content {
  animation: fadeInUp 0.3s ease-out;
}

/* Reset button */
.reset-btn-modern {
  background: transparent;
  border: 1.5px solid #e2e8f0;
  border-radius: 60px;
  padding: 0.9rem;
  font-weight: 600;
  font-size: 0.9rem;
  color: #64748b;
  transition: all 0.3s ease;
  cursor: pointer;
}

.reset-btn-modern:hover {
  border-color: #ef4444;
  color: #ef4444;
  background: rgba(239, 68, 68, 0.05);
}

.reset-btn-modern:active {
  transform: scale(0.98);
}

.reset-btn-modern:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

/* Status validasi */
.text-muted.text-success {
  color: #10b981 !important;
}

.text-muted.text-danger {
  color: #ef4444 !important;
}

/* Dark mode adjustments */
body.dark .login-tabs {
  background: #1e293b;
}

body.dark .tab-btn {
  color: #94a3b8;
}

body.dark .tab-btn.active {
  background: linear-gradient(135deg, #6366f1, #8b5cf6);
  color: white;
}

body.dark .reset-btn-modern {
  border-color: #334155;
  color: #94a3b8;
}

body.dark .reset-btn-modern:hover {
  border-color: #ef4444;
  color: #ef4444;
}
</style>

<script>
function switchTab(tab) {
  const loginTab = document.getElementById('loginTab');
  const registerTab = document.getElementById('registerTab');
  const tabs = document.querySelectorAll('.tab-btn');
  
  tabs.forEach(btn => btn.classList.remove('active'));
  
  if (tab === 'login') {
    loginTab.style.display = 'block';
    registerTab.style.display = 'none';
    document.querySelector('.tab-btn[data-tab="login"]').classList.add('active');
  } else {
    loginTab.style.display = 'none';
    registerTab.style.display = 'block';
    document.querySelector('.tab-btn[data-tab="register"]').classList.add('active');
  }
  
  // Clear messages
  document.getElementById('loginErrorMsg').style.display = 'none';
  document.getElementById('loginSuccessMsg').style.display = 'none';
}
</script>
