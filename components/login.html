<!DOCTYPE html>
<div id="login-screen-wrapper">
  <div class="login-container">
    <div class="login-card-modern text-center">
      <div class="brand-circle-modern mx-auto">
        <i class="bi bi-arrow-through-heart-fill"></i>
      </div>
      <h1 class="greeting-text-modern">growthogether</h1>
      <p class="sub-greeting-modern">jalan bareng, mimpi nyata ✨</p>
      
      <!-- Tab Navigation -->
      <div class="login-tabs mb-3">
        <button class="tab-btn active" id="tabLoginBtn" onclick="switchTab('login')">
          <i class="bi bi-box-arrow-in-right me-2"></i>Login
        </button>
        <button class="tab-btn" id="tabRegisterBtn" onclick="switchTab('register')">
          <i class="bi bi-person-plus-fill me-2"></i>Register
        </button>
      </div>
      
      <!-- LOGIN FORM -->
      <div id="loginTab" class="tab-content" style="display: block;">
        <div class="input-icon">
          <i class="bi bi-person-badge"></i>
          <input type="text" id="loginIdentifier" class="input-modern" placeholder="Username / No HP / Email" autocomplete="off">
        </div>
        
        <div class="input-icon">
          <i class="bi bi-lock-fill"></i>
          <input type="password" id="loginPassword" class="input-modern" placeholder="Kata sandi">
        </div>
        
        <button onclick="handleLogin()" class="login-btn-modern w-100 mt-2">
          <i class="bi bi-box-arrow-in-right me-2"></i> Masuk
        </button>
      </div>
      
      <!-- REGISTER FORM -->
      <div id="registerTab" class="tab-content" style="display: none;">
        <div class="input-icon">
          <i class="bi bi-person-circle"></i>
          <input type="text" id="regFullname" class="input-modern" placeholder="Nama Lengkap" autocomplete="off">
        </div>
        
        <div class="input-icon">
          <i class="bi bi-person-badge"></i>
          <input type="text" id="regUsername" class="input-modern" placeholder="Username" autocomplete="off">
        </div>
        <div id="usernameStatus" class="validation-status"></div>
        
        <div class="input-icon">
          <i class="bi bi-telephone"></i>
          <input type="tel" id="regPhone" class="input-modern" placeholder="No. HP" autocomplete="off">
        </div>
        <div id="phoneStatus" class="validation-status"></div>
        
        <div class="input-icon">
          <i class="bi bi-envelope"></i>
          <input type="email" id="regEmail" class="input-modern" placeholder="Email" autocomplete="off">
        </div>
        <div id="emailStatus" class="validation-status"></div>
        
        <div class="input-icon">
          <i class="bi bi-lock-fill"></i>
          <input type="password" id="regPassword" class="input-modern" placeholder="Password (min. 4)">
        </div>
        
        <div class="input-icon">
          <i class="bi bi-lock-fill"></i>
          <input type="password" id="regConfirmPassword" class="input-modern" placeholder="Konfirmasi Password">
        </div>
        
        <button onclick="handleRegister()" class="login-btn-modern w-100 mt-2" id="registerBtn">
          <i class="bi bi-person-plus-fill me-2"></i> Daftar Akun Baru
        </button>
      </div>
      
      <div id="loginErrorMsg" class="mt-2 text-danger" style="display:none; font-size: 12px;">
        <i class="bi bi-exclamation-triangle-fill"></i> <span id="errorText"></span>
      </div>
      
      <div id="loginSuccessMsg" class="mt-2 text-success" style="display:none; font-size: 12px;">
        <i class="bi bi-check-circle-fill"></i> <span id="successText"></span>
      </div>
      
      <div class="mt-3">
        <small class="text-muted">
          <i class="bi bi-heart-fill text-danger"></i> 
          Pasangan bahagia, masa depan cerah
        </small>
      </div>
    </div>
  </div>

  <!-- Floating hearts background -->
  <div class="floating-heart-bg" style="top: 10%; left: 5%;">❤️</div>
  <div class="floating-heart-bg" style="top: 20%; right: 8%;">💖</div>
  <div class="floating-heart-bg" style="bottom: 15%; left: 10%;">💕</div>
  <div class="floating-heart-bg" style="bottom: 25%; right: 15%;">💗</div>
  <div class="floating-heart-bg" style="top: 50%; left: 20%;">💓</div>
</div>

<style>
/* Login screen full screen dan center */
#login-screen {
  position: fixed !important;
  top: 0 !important;
  left: 0 !important;
  width: 100% !important;
  height: 100% !important;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important;
  z-index: 2000 !important;
  display: flex !important;
  align-items: center !important;
  justify-content: center !important;
  overflow-y: auto !important;
}

#login-screen-wrapper {
  width: 100%;
  min-height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.login-container {
  width: 100%;
  max-width: 400px;
  margin: auto;
}

.login-card-modern {
  background: rgba(255, 255, 255, 0.98);
  backdrop-filter: blur(10px);
  border-radius: 32px;
  padding: 1.5rem;
  width: 100%;
  box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.3);
}

/* Tab styles */
.login-tabs {
  display: flex;
  gap: 8px;
  background: #f1f5f9;
  border-radius: 40px;
  padding: 4px;
}

.tab-btn {
  flex: 1;
  padding: 8px 12px;
  border: none;
  background: transparent;
  border-radius: 40px;
  font-weight: 600;
  font-size: 0.85rem;
  color: #64748b;
  cursor: pointer;
  transition: all 0.3s ease;
}

.tab-btn.active {
  background: linear-gradient(135deg, #6366f1, #8b5cf6);
  color: white;
  box-shadow: 0 2px 8px rgba(99, 102, 241, 0.3);
}

.tab-btn:active {
  transform: scale(0.98);
}

/* Input styling */
.input-icon {
  position: relative;
  margin-bottom: 12px;
}

.input-icon i {
  position: absolute;
  left: 16px;
  top: 50%;
  transform: translateY(-50%);
  color: #64748b;
  font-size: 1rem;
  z-index: 1;
}

.input-modern {
  width: 100%;
  border: 1.5px solid #e2e8f0;
  border-radius: 40px;
  padding: 10px 16px 10px 44px;
  font-size: 0.9rem;
  transition: all 0.3s ease;
  background: white;
}

.input-modern:focus {
  border-color: #6366f1;
  outline: none;
  box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
}

/* Validation status */
.validation-status {
  font-size: 10px;
  margin-top: -8px;
  margin-bottom: 8px;
  padding-left: 12px;
  text-align: left;
}

.validation-status.text-success {
  color: #10b981;
}

.validation-status.text-danger {
  color: #ef4444;
}

.validation-status.text-warning {
  color: #f59e0b;
}

/* Buttons */
.login-btn-modern {
  background: linear-gradient(135deg, #6366f1, #8b5cf6);
  border: none;
  border-radius: 40px;
  padding: 10px;
  font-weight: 600;
  font-size: 0.9rem;
  color: white;
  transition: all 0.3s ease;
  cursor: pointer;
}

.login-btn-modern:active {
  transform: scale(0.98);
}

.login-btn-modern:disabled {
  opacity: 0.7;
  cursor: not-allowed;
}

.reset-btn-modern {
  background: transparent;
  border: 1.5px solid #e2e8f0;
  border-radius: 40px;
  padding: 10px;
  font-weight: 600;
  font-size: 0.85rem;
  color: #64748b;
  transition: all 0.3s ease;
  cursor: pointer;
}

.reset-btn-modern:hover {
  border-color: #ef4444;
  color: #ef4444;
  background: rgba(239, 68, 68, 0.05);
}

.reset-btn-modern:active {
  transform: scale(0.98);
}

.reset-btn-modern:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

/* Brand */
.brand-circle-modern {
  width: 60px;
  height: 60px;
  background: linear-gradient(135deg, #6366f1, #8b5cf6);
  border-radius: 30px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 1rem;
  box-shadow: 0 8px 20px rgba(99, 102, 241, 0.3);
}

.brand-circle-modern i {
  font-size: 32px;
  color: white;
}

.greeting-text-modern {
  font-size: 1.5rem;
  font-weight: 800;
  background: linear-gradient(135deg, #1e293b, #4f46e5);
  background-clip: text;
  -webkit-background-clip: text;
  color: transparent;
  margin-bottom: 0.25rem;
}

.sub-greeting-modern {
  font-size: 0.8rem;
  color: #64748b;
  margin-bottom: 1.25rem;
}

/* Floating hearts */
.floating-heart-bg {
  position: absolute;
  font-size: 20px;
  opacity: 0.5;
  animation: floatHeartBg 6s ease-in-out infinite;
  pointer-events: none;
}

@keyframes floatHeartBg {
  0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0.5; }
  50% { transform: translateY(-15px) rotate(5deg); opacity: 0.3; }
}

/* Dark mode */
body.dark .login-card-modern {
  background: rgba(30, 41, 59, 0.98);
}

body.dark .input-modern {
  background: #1e293b;
  border-color: #334155;
  color: #f1f5f9;
}

body.dark .login-tabs {
  background: #1e293b;
}

body.dark .tab-btn {
  color: #94a3b8;
}

body.dark .tab-btn.active {
  background: linear-gradient(135deg, #6366f1, #8b5cf6);
  color: white;
}

body.dark .reset-btn-modern {
  border-color: #334155;
  color: #94a3b8;
}

body.dark .greeting-text-modern {
  background: linear-gradient(135deg, #f1f5f9, #a5b4fc);
  background-clip: text;
  -webkit-background-clip: text;
}

/* Mobile */
@media (max-width: 480px) {
  .login-card-modern {
    padding: 1.25rem;
  }
  
  .brand-circle-modern {
    width: 50px;
    height: 50px;
  }
  
  .brand-circle-modern i {
    font-size: 28px;
  }
  
  .greeting-text-modern {
    font-size: 1.3rem;
  }
  
  .input-modern {
    padding: 8px 12px 8px 40px;
    font-size: 0.85rem;
  }
  
  .tab-btn {
    padding: 6px 10px;
    font-size: 0.8rem;
  }
}
</style>

<script>
// Fungsi switch tab yang global
window.switchTab = function(tab) {
  console.log("Switching to tab:", tab);
  
  const loginTab = document.getElementById('loginTab');
  const registerTab = document.getElementById('registerTab');
  const tabLoginBtn = document.getElementById('tabLoginBtn');
  const tabRegisterBtn = document.getElementById('tabRegisterBtn');
  
  if (!loginTab || !registerTab) {
    console.error("Tab elements not found!");
    return;
  }
  
  if (tab === 'login') {
    loginTab.style.display = 'block';
    registerTab.style.display = 'none';
    if (tabLoginBtn) tabLoginBtn.classList.add('active');
    if (tabRegisterBtn) tabRegisterBtn.classList.remove('active');
  } else {
    loginTab.style.display = 'none';
    registerTab.style.display = 'block';
    if (tabRegisterBtn) tabRegisterBtn.classList.add('active');
    if (tabLoginBtn) tabLoginBtn.classList.remove('active');
  }
  
  // Clear messages
  const errorDiv = document.getElementById('loginErrorMsg');
  const successDiv = document.getElementById('loginSuccessMsg');
  if (errorDiv) errorDiv.style.display = 'none';
  if (successDiv) successDiv.style.display = 'none';
};

// Pastikan fungsi switchTab tersedia secara global
window.switchTab = window.switchTab;

// Inisialisasi tombol tab saat halaman loading
document.addEventListener('DOMContentLoaded', function() {
  console.log("Login page loaded");
  
  // Pastikan tab login aktif
  const loginTab = document.getElementById('loginTab');
  const registerTab = document.getElementById('registerTab');
  if (loginTab && registerTab) {
    loginTab.style.display = 'block';
    registerTab.style.display = 'none';
  }
});
</script>
