<!-- MODAL PROFILE - Lengkap dengan Foto & Ganti Password -->
<div class="modal fade" id="profileModal" tabindex="-1" data-bs-backdrop="static">
  <div class="modal-dialog modal-dialog-centered modal-sm">
    <div class="modal-content rounded-4 overflow-hidden">
      
      <!-- Header dengan background gradient -->
      <div class="modal-header border-0 py-4 text-center d-block" style="background: linear-gradient(135deg, #6366f1, #8b5cf6);">
        <div class="profile-edit-avatar mx-auto position-relative" style="width: 100px; height: 100px;">
          <img id="modalProfileAvatar" class="rounded-circle w-100 h-100 object-fit-cover border border-3 border-white shadow" 
               src="https://ui-avatars.com/api/?background=fff&color=6366f1&bold=true&size=100&name=User" 
               alt="Profile">
          <button class="change-photo-btn" onclick="document.getElementById('profilePhotoInput').click()">
            <i class="bi bi-camera-fill"></i>
          </button>
        </div>
        <h5 class="fw-bold text-white mt-2 mb-0" id="modalProfileName">User</h5>
        <p class="text-white-50 small mb-0" id="modalProfileEmail">user@growthogether.com</p>
      </div>
      
      <div class="modal-body p-4">
        <!-- Status Section -->
        <div class="mb-4">
          <label class="form-label fw-semibold small text-muted">
            <i class="bi bi-emoji-smile me-1"></i> Status
          </label>
          <div class="status-options d-flex gap-2 flex-wrap">
            <button class="status-badge" data-status="merencanakan" onclick="updateStatus('merencanakan')">
              <i class="bi bi-calendar-check"></i> Merencanakan
            </button>
            <button class="status-badge" data-status="online" onclick="updateStatus('online')">
              <i class="bi bi-circle-fill text-success" style="font-size: 10px;"></i> Online
            </button>
            <button class="status-badge" data-status="sibuk" onclick="updateStatus('sibuk')">
              <i class="bi bi-clock"></i> Sibuk
            </button>
            <button class="status-badge" data-status="liburan" onclick="updateStatus('liburan')">
              <i class="bi bi-umbrella"></i> Liburan
            </button>
          </div>
        </div>
        
        <!-- Divider -->
        <div class="dropdown-divider my-3"></div>
        
        <!-- Ganti Password Section -->
        <div class="mb-3">
          <label class="form-label fw-semibold small text-muted">
            <i class="bi bi-lock me-1"></i> Keamanan
          </label>
          <button class="btn btn-outline-primary w-100 rounded-pill py-2 mb-2" onclick="openChangePasswordFromProfile()">
            <i class="bi bi-key me-2"></i>Ganti Password
          </button>
        </div>
        
        <!-- Divider -->
        <div class="dropdown-divider my-3"></div>
        
        <!-- Info Akun -->
        <div class="small text-muted text-center">
          <i class="bi bi-shield-check me-1"></i>
          Akun dilindungi
        </div>
      </div>
      
      <div class="modal-footer border-0 justify-content-center pb-4">
        <button class="btn btn-secondary rounded-pill px-4" data-bs-dismiss="modal">Tutup</button>
      </div>
    </div>
  </div>
</div>

<!-- MODAL GANTI PASSWORD (Standalone) -->
<div class="modal fade" id="passModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content rounded-4">
      <div class="modal-header border-0 bg-gradient bg-primary text-white py-3">
        <h5 class="fw-bold mb-0">
          <i class="bi bi-lock me-2"></i>Ganti Password
        </h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body p-4">
        <div class="text-center mb-3">
          <i class="bi bi-shield-lock-fill fs-1 text-primary"></i>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Password Baru</label>
          <input type="password" id="newPass" class="form-control rounded-3" placeholder="Minimal 4 karakter">
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Konfirmasi Password</label>
          <input type="password" id="confirmPass" class="form-control rounded-3" placeholder="Ketik ulang password baru">
        </div>
        <button onclick="window.updateCloudPassword()" class="btn btn-primary w-100 rounded-pill py-2">
          <i class="bi bi-save me-2"></i>Update Password
        </button>
      </div>
    </div>
  </div>
</div>

<!-- MODAL KONFIRMASI LOGOUT -->
<div class="modal fade" id="confirmLogoutModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content rounded-4">
      <div class="modal-header bg-warning text-dark">
        <h5 class="fw-bold mb-0">Keluar Aplikasi</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body text-center py-4">
        <i class="bi bi-question-circle fs-1 text-muted mb-3 d-block"></i>
        <p>Yakin ingin keluar dari aplikasi?</p>
      </div>
      <div class="modal-footer border-0 justify-content-center gap-3 pb-4">
        <button class="btn btn-secondary rounded-pill px-4" data-bs-dismiss="modal">Batal</button>
        <button id="confirmLogoutBtn" class="btn btn-danger rounded-pill px-4">Logout</button>
      </div>
    </div>
  </div>
</div>

<!-- MODAL TAMBAH/EDIT MOMEN -->
<div class="modal fade" id="momentModal" tabindex="-1" data-bs-backdrop="static">
  <div class="modal-dialog modal-dialog-centered modal-md">
    <div class="modal-content rounded-4">
      <div class="modal-header border-0 bg-gradient bg-danger text-white py-3">
        <h5 class="fw-bold mb-0">
          <i class="bi bi-camera-fill me-2"></i>
          <span id="momentModalTitle">Tambah Momen</span>
        </h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body p-4" style="max-height: 70vh; overflow-y: auto">
        <input type="hidden" id="momentEditId">

        <div class="mb-3">
          <label class="form-label fw-semibold small">📅 Tanggal <span class="text-danger">*</span></label>
          <input type="date" id="momentDate" class="form-control rounded-3">
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold small">✏️ Judul Momen</label>
          <input type="text" id="momentTitle" class="form-control rounded-3" placeholder="Misal: Pertama Kali Bertemu">
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold small">📝 Cerita / Deskripsi</label>
          <textarea id="momentStory" class="form-control rounded-3" rows="3" placeholder="Ceritakan momen spesial ini..."></textarea>
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold small">🖼️ Foto (max 5 foto)</label>
          <div class="photo-upload-grid" id="photoUploadGrid">
            <div class="photo-upload-item" onclick="document.getElementById('momentPhotoInput').click()">
              <i class="bi bi-plus-circle-fill"></i>
              <span>Tambah Foto</span>
            </div>
          </div>
          <input type="file" id="momentPhotoInput" accept="image/jpeg,image/png,image.jpg" multiple style="display: none" onchange="handleMultiplePhotos(this)">
          <small class="text-muted">Klik untuk upload, maksimal 5 foto (max 2MB per foto)</small>
        </div>

        <div class="form-check">
          <input type="checkbox" id="momentIsSpecial" class="form-check-input">
          <label class="form-check-label">⭐ Jadikan sebagai momen spesial (highlight)</label>
        </div>
      </div>
      <div class="modal-footer border-0 pt-0 pb-4">
        <button type="button" class="btn btn-secondary rounded-3 px-4" data-bs-dismiss="modal">Batal</button>
        <button type="button" class="btn btn-danger rounded-3 px-4" onclick="saveMoment()">
          <i class="bi bi-save me-2"></i>Simpan
        </button>
      </div>
    </div>
  </div>
</div>

<!-- MODAL DETAIL MOMEN -->
<div class="modal fade" id="momentDetailModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-md">
    <div class="modal-content rounded-4">
      <div class="modal-header border-0 py-3">
        <h5 class="fw-bold mb-0" id="detailTitle">Momen Spesial</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body p-0">
        <div id="detailCarousel" class="carousel slide" data-bs-ride="false">
          <div class="carousel-inner" id="detailCarouselInner"></div>
          <button class="carousel-control-prev" type="button" data-bs-target="#detailCarousel" data-bs-slide="prev">
            <span class="carousel-control-prev-icon bg-dark rounded-circle p-2"></span>
          </button>
          <button class="carousel-control-next" type="button" data-bs-target="#detailCarousel" data-bs-slide="next">
            <span class="carousel-control-next-icon bg-dark rounded-circle p-2"></span>
          </button>
        </div>

        <div class="p-4">
          <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
            <div class="d-flex gap-2">
              <span class="badge bg-danger px-3 py-2" id="detailMood">❤️ Momen Berkesan</span>
              <span class="badge bg-secondary px-3 py-2" id="detailDate"></span>
            </div>
            <div class="dropdown">
              <button class="btn btn-sm btn-outline-secondary" data-bs-toggle="dropdown">
                <i class="bi bi-three-dots-vertical"></i>
              </button>
              <ul class="dropdown-menu dropdown-menu-end">
                <li>
                  <a class="dropdown-item" onclick="editMomentFromDetail()">
                    <i class="bi bi-pencil me-2"></i>Edit Momen
                  </a>
                </li>
                <li><hr class="dropdown-divider"></li>
                <li>
                  <a class="dropdown-item text-danger" onclick="deleteMomentFromDetail()">
                    <i class="bi bi-trash me-2"></i>Hapus Momen
                  </a>
                </li>
              </ul>
            </div>
          </div>

          <p id="detailStory" class="mb-3" style="line-height: 1.6"></p>

          <hr>

          <div class="d-flex justify-content-between align-items-center">
            <small class="text-muted" id="detailAuthor"></small>
            <small class="text-muted" id="detailDateCreated"></small>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Input file untuk upload foto profil (hidden) -->
<input type="file" id="profilePhotoInput" accept="image/jpeg,image/png,image/jpg" style="display: none" onchange="handleProfilePhotoUpload(this)">
